services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
  app:
    image: ghcr.io/superstrika/superstrika-web:latest
    expose: ["3000"]
    environment:
      DATABASE_URL: postgresql://fundledger:${POSTGRES_PASSWORD:-change-me}@db:5432/fundledger?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-replace-me-before-production}
      UPLOAD_DIR: /app/uploads
      ROBOT_VERSIONS_DIR: /app/robot-versions
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-this-now}
      FX_API_URL: ${FX_API_URL:-https://api.frankfurter.app/latest}
    volumes:
      - ${UPLOAD_PATH:-./uploads}:/app/uploads
      - ${ROBOT_VERSIONS_PATH:-./robot-versions}:/app/robot-versions
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundledger
      POSTGRES_USER: fundledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundledger -d fundledger"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
